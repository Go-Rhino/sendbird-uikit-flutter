name: sendbird_uikit
description: With Sendbird UIKit for Flutter, you can easily build an in-app chat with all the essential messaging features.
version: 1.1.0
homepage: https://sendbird.com
repository: https://github.com/sendbird/sendbird-uikit-flutter
documentation: https://sendbird.com/docs/chat/uikit/v3/flutter/overview

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.41.0 <3.42.0'

platforms:
  android:
  ios:
  web:

dependencies:
  flutter:
    sdk: flutter

  sendbird_chat_sdk: ^4.9.0
  provider: ^6.1.2
  intl: '>=0.18.1 <1.0.0'
  collection: any
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.4
  fluttertoast: ^9.0.0
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  video_thumbnail: ^0.5.6
  path_provider: ^2.1.5
  gif: ^2.3.0
  scroll_to_index: ^3.0.1
  flutter_screenutil: 5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
